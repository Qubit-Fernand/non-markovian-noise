[project]
name = "nonmarkovian-gate-demo"
version = "0.1.0"
description = "Finite-pulse quantum circuits with classical colored noise and quantum-bath memory"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "qutip>=5.2,<6"]

[project.optional-dependencies]
test = ["pytest>=8"]
tn-ng = ["tensorcircuit-ng>=1.10,<2"]
tn-legacy = ["tensorcircuit>=0.12,<0.13", "numpy>=1.26,<2"]

[project.scripts]
spp-tn = "spp_tn.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nmnoise*", "spp_tn*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
