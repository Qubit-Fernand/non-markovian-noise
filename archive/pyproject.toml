[project]
name = "nmnoise-archive"
version = "0.1.0"
description = "Finite-pulse quantum circuits with classical colored noise and quantum-bath memory"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "qutip>=5.2,<6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nmnoise*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
